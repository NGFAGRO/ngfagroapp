<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap');
:root{
  --forest:#1b5940; --forest-deep:#123d2b; --forest-soft:#e3efe8;
  --wheat-deep:#8a5608; --wheat-soft:#faf1de;
  --clay:#ae3b28; --clay-soft:#fbeae6;
  --indigo:#2c4a80; --indigo-soft:#e8edf7;
  --plum:#6a3d95;
  /* খাতার কাগজ: ক্রিম নয়, হালকা সবুজাভ-ধূসর */
  --paper:#e9eeea; --card:#ffffff; --ink:#1f2620; --muted:#6d7a71; --line:#dbe3dd;
  --rule:#cfdcd4;
  --shadow-sm:0 1px 2px rgba(31,38,32,.06);
  --shadow-md:0 4px 14px rgba(31,38,32,.08);
  --shadow-lg:0 10px 30px rgba(31,38,32,.13);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Bengali','Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{
  background:var(--paper);
  /* খাতার সূক্ষ্ম রুলিং */
  background-image:repeating-linear-gradient(to bottom, transparent 0 27px, rgba(27,89,64,.045) 27px 28px);
  padding:10px; padding-bottom:80px; color:var(--ink); font-size:14px; line-height:1.45;
}
.wrap{max-width:600px;margin:0 auto}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);overflow:hidden;border:1px solid rgba(31,38,32,.05)}

.header{background:linear-gradient(155deg,var(--forest-deep) 0%,var(--forest) 55%,#1f6b4a 100%);padding:22px 18px 26px;color:#fff;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.06)}
.header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.26),rgba(255,255,255,.08))}
.header h1{font-size:22px;font-weight:700;letter-spacing:.1px;position:relative}
.header p{font-size:12px;opacity:.78;margin-top:3px;position:relative;font-weight:500}
.content{padding:14px 13px 6px}

.btn{width:100%;padding:12px;border-radius:12px;font-weight:600;font-size:14px;border:none;cursor:pointer;color:#fff;transition:transform .1s,box-shadow .15s,filter .15s;box-shadow:var(--shadow-sm);letter-spacing:.1px}
.btn:active{transform:scale(.97);filter:brightness(.93);box-shadow:none}
.btn-green{background:linear-gradient(155deg,#1d6647,var(--forest))}
.btn-blue{background:linear-gradient(155deg,#33538f,var(--indigo))}
.btn-red{background:linear-gradient(155deg,#c1462f,var(--clay))}
.btn-purple{background:linear-gradient(155deg,#7745a8,var(--plum))}
.btn-orange{background:linear-gradient(155deg,#a1650c,var(--wheat-deep))}
.btn-sm{padding:8px 13px;font-size:12.5px;width:auto;border-radius:10px;box-shadow:none}

input,select{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:11px;font-size:14px;margin-bottom:9px;background:#fcfdfc;color:var(--ink);transition:border-color .15s,box-shadow .15s;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 3.5px rgba(27,89,64,.13);background:#fff}
input::placeholder{color:#9aa79f}

.box{padding:13px;border-radius:12px;margin:10px 0}
.box-green{background:var(--forest-soft);border:1px solid #c9e0d3;border-left:3.5px solid var(--forest)}
.box-blue{background:var(--indigo-soft);border:1px solid #d1ddf1;border-left:3.5px solid var(--indigo)}
.box-orange{background:var(--wheat-soft);border:1px solid #eddbb3;border-left:3.5px solid var(--wheat-deep)}
.box-yellow{background:#fbf5e2;border:1px solid #ecdca0;border-left:3.5px solid #a5750f}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden;box-shadow:var(--shadow-sm)}
.item-head{padding:12px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:background .15s;gap:10px}
.item-head:active{background:#f4f8f5}
.item-body{border-top:1px dashed var(--line);padding:13px;background:#fbfdfb;font-size:13px}

/* কাস্টমার সারি: ইনিশিয়াল + নাম + বড় করে বাকি */
.avatar{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;flex-shrink:0;color:#fff}
.av-due{background:linear-gradient(150deg,#c45b45,var(--clay))}
.av-paid{background:linear-gradient(150deg,#2a7a58,var(--forest))}
.av-adv{background:linear-gradient(150deg,#4367a5,var(--indigo))}
.rowmain{flex:1;min-width:0}
.rowname{font-weight:700;font-size:14px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowmeta{font-size:11px;color:var(--muted);margin-top:1px}
.rowamt{text-align:right;flex-shrink:0}
.rowamt .big{font-size:16px;font-weight:800;line-height:1.15;letter-spacing:-.2px}
.rowamt .cap{font-size:9.5px;color:var(--muted);font-weight:600;margin-top:1px}

.flex{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center}
.bold{font-weight:700}
.green{color:var(--forest)}.red{color:var(--clay)}.blue{color:var(--indigo)}.gray{color:var(--muted)}.orange{color:var(--wheat-deep)}
.sm{font-size:12.5px}.xs{font-size:11px}
.center{text-align:center}
.mt{margin-top:8px}.mb{margin-bottom:8px}
.note{text-align:center;color:#93a199;font-size:11px;margin-top:10px}

.cart-row{display:flex;align-items:center;gap:8px;background:#f4f8f5;padding:9px;border-radius:10px;margin-bottom:6px;border:1px solid var(--line)}
.cart-row input{width:64px;text-align:center;margin-bottom:0}

.nav{position:fixed;bottom:8px;left:8px;right:8px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(31,38,32,.07);border-radius:22px;display:flex;box-shadow:0 8px 28px rgba(31,38,32,.16);padding:5px 3px}
.nav button{flex:1;padding:8px 2px;background:none;border:none;cursor:pointer;color:#8b968e;font-size:9.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px;margin:0 1px;transition:background .18s,color .18s,transform .12s}
.nav button:active{transform:scale(.92)}
.nav button.active{color:#fff;background:linear-gradient(155deg,#1d6647,var(--forest));box-shadow:0 3px 10px rgba(27,89,64,.35)}
.nav .ico{font-size:18px;line-height:1}

.stat{padding:15px 10px;border-radius:12px;text-align:center;border:1px solid rgba(31,38,32,.05);box-shadow:var(--shadow-sm)}
.stat .num{font-size:19px;font-weight:800}
.stat .lbl{font-size:10.5px;color:var(--muted);margin-top:4px;font-weight:600}

label.upload{flex:1;background:linear-gradient(155deg,#7745a8,var(--plum));color:#fff;padding:12px;border-radius:12px;font-weight:600;font-size:14px;text-align:center;cursor:pointer;display:block;box-shadow:var(--shadow-sm)}
label.upload input{display:none}

.divider{border-top:1px dashed var(--rule);margin:14px 0}

/* ফেরানোর বার */
.undobar{display:flex;align-items:center;gap:10px;background:linear-gradient(140deg,#fdf6e6,#f9eed6);border:1px solid #e8d5a8;border-left:3.5px solid var(--wheat-deep);border-radius:12px;padding:10px 12px;margin-bottom:11px;cursor:pointer;box-shadow:var(--shadow-sm);transition:transform .1s}
.undobar:active{transform:scale(.985)}
.undobar .ub-i{font-size:19px;flex-shrink:0}
.undobar .ub-t{flex:1;min-width:0;font-size:13px;font-weight:700;color:#6b4406;line-height:1.3;display:flex;flex-direction:column}
.undobar .ub-s{font-size:10.5px;font-weight:500;color:#8a7350;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.undobar .ub-b{flex-shrink:0;background:var(--wheat-deep);color:#fff;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:9px}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:9.5px;font-weight:700;vertical-align:middle;letter-spacing:.2px}
.tag-red{background:var(--clay-soft);color:var(--clay)}
.tag-green{background:var(--forest-soft);color:var(--forest-deep)}

/* তারিখের গ্রুপ হেডার */
.daybar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 6px;padding:5px 11px;background:rgba(27,89,64,.07);border-left:3px solid var(--forest);border-radius:0 8px 8px 0}
.daybar .d{font-weight:700;font-size:12px;color:var(--forest-deep)}
.daybar .n{font-size:10.5px;color:var(--muted);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
  <div class="header">
    <h1>🌾 NGF AGRO</h1>
    <p id="headerSub">বিজনেস ম্যানেজমেন্ট</p>
  </div>
  <div class="content" id="content"></div>
</div>
<p class="note">🔒 সব ডাটা আপনার ফোনে সংরক্ষিত · সংস্করণ <span id="verTag">—</span></p>
</div>

<div class="nav">
  <button id="navHome" onclick="switchTab('dashboard')"><span class="ico">📊</span>হোম</button>
  <button id="navCustomer" onclick="switchTab('customer')"><span class="ico">👥</span>কাস্টমার</button>
  <button id="navDue" onclick="switchTab('due')"><span class="ico">💰</span>বকেয়া</button>
  <button id="navSupplier" onclick="switchTab('supplier')"><span class="ico">🏭</span>সাপ্লায়ার</button>
  <button id="navStock" onclick="switchTab('stock')"><span class="ico">📦</span>স্টক</button>
  <button id="navExpense" onclick="switchTab('expense')"><span class="ico">💸</span>খরচ</button>
  <button id="navMore" onclick="switchTab('more')"><span class="ico">⚙️</span>আরও</button>
</div>

<script>
let stock = JSON.parse(localStorage.getItem('ngfStock') || '[]');
let customers = JSON.parse(localStorage.getItem('ngfCustomers') || '[]');
let suppliers = JSON.parse(localStorage.getItem('ngfSuppliers') || '[]');
let withdrawals = JSON.parse(localStorage.getItem('ngfWithdrawals') || '[]');
let expenses = JSON.parse(localStorage.getItem('ngfExpenses') || '[]');
let expCats = JSON.parse(localStorage.getItem('ngfExpCats') || '["দোকান ভাড়া","বিদ্যুৎ বিল","কর্মচারী বেতন","গাড়ি/পরিবহন","খাওয়া-দাওয়া","মোবাইল/ইন্টারনেট","সংসার খরচ","অন্যান্য"]');
let inactiveDaysLimit = parseInt(localStorage.getItem('ngfInactiveDays') || '30');
let activeTab = 'dashboard';
let showAddStock=false, showAddCustomer=false, showAddSupplier=false;
let expandedStock=null, expandedCustomer=null, expandedSupplier=null;
let cart = {};
let custSearch = '';
let dueSearch = '';
let expandedMonth = null;
let expandedTopMonth = null;
let expandedStatMonth = null;
let expandedExpMonth = null;
let editingCustInfo = null;
let returningSale = null;
let returnQty = {};
let expandedTimeline = null;
let editingSale = null; // {custId, saleId, myFreight, custFreight}
let history = JSON.parse(localStorage.getItem('ngfHistory') || '[]');
const HISTORY_MAX = 12;
const APP_VER = '১৯ অক্টোবর ২০২৬';
let showSalesReport = false;
let selectedExisting = null;
let existSearch = '';
let goodsSearch = '';

function save() {
  localStorage.setItem('ngfStock', JSON.stringify(stock));
  localStorage.setItem('ngfCustomers', JSON.stringify(customers));
  localStorage.setItem('ngfSuppliers', JSON.stringify(suppliers));
  localStorage.setItem('ngfWithdrawals', JSON.stringify(withdrawals));
  localStorage.setItem('ngfExpenses', JSON.stringify(expenses));
  localStorage.setItem('ngfExpCats', JSON.stringify(expCats));
}
// সর্বদা অনন্য আইডি তৈরি (একই মিলিসেকেন্ডেও আলাদা থাকবে)
let _lastId=0;
function newId(){
  let id=Date.now();
  if(id<=_lastId) id=_lastId+1;
  _lastId=id;
  return id;
}
// শুধু প্রথম মিলে যাওয়া কাস্টমারকে বদলায় (ডুপ্লিকেট আইডি থাকলেও অন্যজনে ছড়াবে না)
function updateCustomerById(id, fn){
  const target=String(id);
  let done=false;
  customers=customers.map(c=>{
    c=migrateCustomer(c);
    if(!done && String(c.id)===target){ done=true; return fn(c); }
    return c;
  });
  return done;
}
// ─── আগের অবস্থায় ফেরানোর ব্যবস্থা (আনডু) ───
// প্রতিটা পরিবর্তনের ঠিক আগে বর্তমান অবস্থা জমা রাখি
function snap(label){
  try{
    const data=JSON.stringify({stock,customers,suppliers,withdrawals,expenses});
    history.push({ts:Date.now(), date:now(), label:label, data:data});
    while(history.length>HISTORY_MAX) history.shift();
    let saved=false;
    while(!saved){
      try{ localStorage.setItem('ngfHistory', JSON.stringify(history)); saved=true; }
      catch(e){
        if(history.length>1){ history.shift(); }  // জায়গা না থাকলে পুরনোগুলো বাদ
        else { history=[]; try{ localStorage.removeItem('ngfHistory'); }catch(e2){} saved=true; }
      }
    }
  }catch(e){}
}
// এক ধাপ পেছনে
function undoLast(){
  if(!history.length){ alert('ফেরানোর মতো কিছু নেই'); return; }
  const h=history[history.length-1];
  if(!confirm('এই কাজটি বাতিল করে আগের অবস্থায় ফিরবেন?\n\n"'+h.label+'"\n'+h.date)) return;
  applyHistory(history.length-1);
}
// নির্দিষ্ট ধাপে ফেরা (ওই ধাপের ঠিক আগের অবস্থা)
function restoreTo(i){
  const h=history[i];
  if(!h) return;
  if(!confirm('"'+h.label+'" — এই কাজের ঠিক আগের অবস্থায় ফিরবেন?\n'+h.date+'\n\nএর পরের সব পরিবর্তনও বাতিল হবে।')) return;
  applyHistory(i);
}
function applyHistory(i){
  const h=history[i];
  if(!h) return;
  let d;
  try{ d=JSON.parse(h.data); }catch(e){ alert('এই ধাপটি পড়া যাচ্ছে না'); return; }
  stock=d.stock||[]; customers=d.customers||[]; suppliers=d.suppliers||[];
  withdrawals=d.withdrawals||[]; expenses=d.expenses||[];
  history=history.slice(0,i);
  try{ localStorage.setItem('ngfHistory', JSON.stringify(history)); }catch(e){}
  customers=customers.map(c=>migrateCustomer(c));
  backfillTimestamps();
  cart={}; selectedExisting=null; editingSale=null; showAddCustomer=false;
  save(); render();
  alert('✓ আগের অবস্থায় ফেরানো হয়েছে');
}
function clearHistory(){
  if(!confirm('ফেরানোর তালিকা মুছবেন? (আপনার হিসাব অক্ষত থাকবে)')) return;
  history=[]; try{ localStorage.removeItem('ngfHistory'); }catch(e){}
  render();
}
// ─── প্রতি কাস্টমারের আলাদা ফেরানোর ব্যবস্থা ───
let custHist={};
try{ custHist=JSON.parse(localStorage.getItem('ngfCustHist')||'{}')||{}; }catch(e){ custHist={}; }
const CHIST_PER=5;      // একজন কাস্টমারের সর্বোচ্চ কত ধাপ জমা থাকবে
const CHIST_TOTAL=40;   // সব কাস্টমার মিলিয়ে সর্বোচ্চ কত ধাপ
function custHistCount(){ return Object.keys(custHist).reduce((a,k)=>a+((custHist[k]||[]).length),0); }
function dropOldestCustHist(){
  let bk=null,bi=-1,bts=Infinity;
  Object.keys(custHist).forEach(k=>{ (custHist[k]||[]).forEach((e,i)=>{ if((e.ts||0)<bts){ bts=e.ts||0; bk=k; bi=i; } }); });
  if(bk===null) return false;
  custHist[bk].splice(bi,1);
  if(!custHist[bk].length) delete custHist[bk];
  return true;
}
function saveCustHist(){
  let saved=false;
  while(!saved){
    try{ localStorage.setItem('ngfCustHist', JSON.stringify(custHist)); saved=true; }
    catch(e){ if(!dropOldestCustHist()){ custHist={}; try{ localStorage.removeItem('ngfCustHist'); }catch(e2){} saved=true; } }
  }
}
// পরিবর্তনের ঠিক আগে এই কাস্টমারের বর্তমান অবস্থা জমা রাখি
function snapCust(custId, label){
  try{
    if(custId===undefined || custId===null) return;
    const k=String(custId);
    const found=customers.find(x=>String(x.id)===k);
    if(!found) return;
    const c=migrateCustomer(found);
    if(!custHist[k]) custHist[k]=[];
    custHist[k].push({ts:Date.now(), date:now(), label:label, cust:JSON.stringify(c)});
    while(custHist[k].length>CHIST_PER) custHist[k].shift();
    while(custHistCount()>CHIST_TOTAL){ if(!dropOldestCustHist()) break; }
    saveCustHist();
  }catch(e){}
}
// একজন কাস্টমার স্টক থেকে নিট কত বস্তা নিয়েছে (ফেরত বাদ দিয়ে)
function custStockUse(c){
  const m={};
  const keyOf=it=>(it.stockId!==undefined && it.stockId!==null)?('#'+it.stockId):('n:'+it.itemName);
  const add=(it,sign)=>{ const k=keyOf(it); if(!m[k]) m[k]={bags:0,itemName:it.itemName,stockId:it.stockId}; m[k].bags+=sign*(it.bags||0); };
  (c.sales||[]).forEach(s=>(s.items||[]).forEach(it=>{ if(it.isOldDue) return; add(it,1); }));
  (c.returns||[]).forEach(r=>(r.items||[]).forEach(it=>add(it,-1)));
  return m;
}
function adjustStockBags(stockId, itemName, delta){
  if(!delta) return;
  let matched=false;
  stock=stock.map(st=>{
    if(!matched && stockId!==undefined && stockId!==null && st.id===stockId){ matched=true; const nb=Math.max(0,(st.totalBags||0)+delta); return {...st,totalBags:nb,totalKg:nb*(st.bagWeight||0)}; }
    return st;
  });
  if(!matched) stock=stock.map(st=>{
    if(!matched && st.name===itemName){ matched=true; const nb=Math.max(0,(st.totalBags||0)+delta); return {...st,totalBags:nb,totalKg:nb*(st.bagWeight||0)}; }
    return st;
  });
}
function applyCustHistory(custId, i){
  const k=String(custId);
  const arr=custHist[k]||[];
  const h=arr[i];
  if(!h) return;
  let saved;
  try{ saved=migrateCustomer(JSON.parse(h.cust)); }catch(e){ alert('এই ধাপটি পড়া যাচ্ছে না'); return; }
  const curRaw=customers.find(x=>String(x.id)===k);
  const cur=migrateCustomer(curRaw?JSON.parse(JSON.stringify(curRaw)):JSON.parse(h.cust));
  // স্টক ঠিক করি: (এখন যত নিয়েছে − তখন যত নিয়েছিল) স্টকে ফেরত যাবে
  const before=custStockUse(saved), after=custStockUse(cur);
  const allKeys={};
  Object.keys(before).forEach(x=>{ allKeys[x]=1; });
  Object.keys(after).forEach(x=>{ allKeys[x]=1; });
  Object.keys(allKeys).forEach(x=>{
    const a=after[x], b=before[x];
    const delta=((a&&a.bags)||0)-((b&&b.bags)||0);
    const ref=a||b;
    adjustStockBags(ref.stockId, ref.itemName, delta);
  });
  // কাস্টমারকে আগের অবস্থায় ফিরিয়ে দিই (শুধু এই একজন)
  let done=false;
  customers=customers.map(c=>{ if(!done && String(c.id)===k){ done=true; return saved; } return c; });
  if(!done) customers.push(saved);
  custHist[k]=arr.slice(0,i);
  if(!custHist[k].length) delete custHist[k];
  saveCustHist();
  cart={}; selectedExisting=null; editingSale=null; showAddCustomer=false; returningSale=null; returnQty={}; editingCustInfo=null;
  save(); render();
  alert('✓ '+(saved.name||'কাস্টমার')+' — আগের অবস্থায় ফেরানো হয়েছে');
}

function bn(n){ return (Math.round((n||0)*100)/100).toLocaleString('bn-BD'); }
// কার্যকর বাকি: ১ টাকার কম (পয়সা) হলে ০ ধরা হবে
function netDue(c){ const d=c.totalSale-c.totalPaid; return Math.abs(d)<1?0:d; }
// কাস্টমার/আইটেমের timestamp: ts না থাকলে id ব্যবহার (id ও Date.now() ছিল)
function getTS(c){ return c.ts || c.id || 0; }
// বাংলা তারিখের লেখা থেকে সময়ের ছাপ উদ্ধার: "২৩/৬/২০২৬, ৭:৫৮:২১ PM"
function parseBnDate(str){
  if(!str) return 0;
  const bn='০১২৩৪৫৬৭৮৯';
  let s=String(str).replace(/[০-৯]/g, d=>bn.indexOf(d));
  const m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:,?\s*(\d{1,2}):(\d{2})(?::(\d{2}))?\s*(AM|PM)?)?/i);
  if(!m) return 0;
  let hh=m[4]?parseInt(m[4]):0;
  const ap=(m[7]||'').toUpperCase();
  if(ap==='PM' && hh<12) hh+=12;
  if(ap==='AM' && hh===12) hh=0;
  const dt=new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]), hh, m[5]?parseInt(m[5]):0, m[6]?parseInt(m[6]):0);
  const t=dt.getTime();
  return isNaN(t)?0:t;
}
// জমা/ছাড়/ফেরতে সময়ের ছাপ না থাকলে তারিখ থেকে বসিয়ে দেওয়া
function backfillTimestamps(){
  let fixed=0;
  customers.forEach(c=>{
    const fallback=c.firstTS||c.id||0;
    ['payments','discounts','returns'].forEach(key=>{
      (c[key]||[]).forEach(e=>{
        if(!e.ts){ e.ts=parseBnDate(e.date)||fallback; fixed++; }
      });
    });
    (c.sales||[]).forEach(s=>{ if(!s.ts){ s.ts=parseBnDate(s.date)||fallback; fixed++; } });
  });
  (expenses||[]).forEach(e=>{ if(!e.ts){ e.ts=parseBnDate(e.date)||0; fixed++; } });
  (withdrawals||[]).forEach(w=>{ if(!w.ts){ w.ts=parseBnDate(w.date)||0; fixed++; } });
  return fixed;
}

// পুরনো কাস্টমার (sales অ্যারে নেই) কে নতুন কাঠামোয় রূপান্তর - অন-দ্য-ফ্লাই
function migrateCustomer(c){
  if(c.sales) return c; // ইতিমধ্যে নতুন কাঠামো
  const allItems=c.items||[];
  // "আগের বকেয়া" আইটেম আলাদা করি
  const oldDueItems=allItems.filter(it=>it.isOldDue || it.itemName==='আগের বকেয়া');
  const goodsItems=allItems.filter(it=>!(it.isOldDue || it.itemName==='আগের বকেয়া'));
  // আগের বকেয়ার মোট
  let oldDueAmount=oldDueItems.reduce((a,it)=>a+(it.saleAmount||0),0);
  // যদি oldDueAmount ফিল্ড আলাদা থাকে সেটাও ধরি (নতুন সেভে ছিল)
  if(c.oldDueAmount && oldDueAmount===0) oldDueAmount=c.oldDueAmount;
  // সাধারণ মালের বিক্রয়
  const goodsSale=goodsItems.reduce((a,it)=>a+(it.saleAmount||0),0);
  const sales=[];
  if(goodsItems.length>0){
    sales.push({
      id:c.id, ts:getTS(c), date:c.date||now(),
      items:goodsItems,
      totalSale:goodsSale,
      totalProfit:c.totalProfit||0,
      myFreight:c.myFreight||0, custFreight:c.custFreight||0
    });
  }
  return {
    id:c.id, name:c.name, mobile:c.mobile, address:c.address||'',
    sales:sales,
    oldDue:oldDueAmount,
    payments:c.payments||[],
    firstTS:getTS(c)
  };
}

// একজন কাস্টমারের মোট হিসাব বের করা
function custTotals(c){
  c=migrateCustomer(c);
  let totalSale=0, totalProfit=0, totalMyFreight=0;
  (c.sales||[]).forEach(s=>{ totalSale+=s.totalSale||0; totalProfit+=s.totalProfit||0; totalMyFreight+=s.myFreight||0; });
  totalSale+=(c.oldDue||0); // আগের বকেয়া মোট পাওনায় যোগ (লাভে নয়)
  const totalPaid=(c.payments||[]).reduce((a,p)=>a+p.amount,0);
  const totalDiscount=(c.discounts||[]).reduce((a,d)=>a+d.amount,0);
  const totalReturn=(c.returns||[]).reduce((a,r)=>a+(r.amount||0),0);
  return {totalSale,totalProfit,totalPaid,totalMyFreight,totalDiscount,totalReturn,netSale:totalSale-totalReturn,netProfit:totalProfit-totalDiscount,balance:totalSale-totalReturn-totalPaid-totalDiscount};
}
// কার্যকর বাকি (পয়সা বাদ)
function custNetDue(c){ const b=custTotals(c).balance; return Math.abs(b)<1?0:b; }
// অগ্রিম জমা (বিলের চেয়ে বেশি দিলে) - ধনাত্মক সংখ্যা ফেরত দেয়
function custAdvance(c){ const b=custTotals(c).balance; return b<-1?Math.abs(b):0; }
// শুধু প্রকৃত পাওনা (ঋণাত্মক হলে ০)
function custDueOnly(c){ const b=custNetDue(c); return b>0?b:0; }
// কাস্টমারের সব লেনদেন সময়ানুক্রমে (মাল, জমা, আগের বকেয়া, ছাড়) - চলমান বাকি সহ
function custTimeline(c){
  c=migrateCustomer(c);
  const events=[];
  if(c.oldDue>0){ events.push({type:'olddue', ts:c.firstTS||0, amount:c.oldDue, label:'আগের/শুরুর বকেয়া'}); }
  (c.sales||[]).forEach(s=>{ events.push({type:'sale', ts:s.ts, sale:s}); });
  (c.payments||[]).forEach(p=>{ events.push({type:'payment', ts:p.ts||0, amount:p.amount, date:p.date}); });
  (c.discounts||[]).forEach(d=>{ events.push({type:'discount', ts:d.ts||0, amount:d.amount, date:d.date, note:d.note}); });
  (c.returns||[]).forEach(r=>{ events.push({type:'return', ts:r.ts||0, amount:r.amount, date:r.date, items:r.items}); });
  events.sort((a,b)=>a.ts-b.ts);
  let running=0;
  events.forEach(e=>{
    if(e.type==='olddue') running+=e.amount;
    else if(e.type==='sale') running+=e.sale.totalSale||0;
    else if(e.type==='payment') running-=e.amount;
    else if(e.type==='discount') running-=e.amount;
    else if(e.type==='return') running-=e.amount;
    e.runningBal=running;
  });
  return events;
}

// মালের নাম থেকে শেষের (তারিখ) অংশ বাদ দিয়ে মূল নাম বের করা - যেমন "সয়াবিন ভুষি (৩০-০৬-২০২৬)" → "সয়াবিন ভুষি"
function baseItemName(name){
  let n=(name||'').trim();
  // সম্পূর্ণ বন্ধনী সহ তারিখ: (৩০-০৬-২০২৬)
  n=n.replace(/\s*\([০-৯0-9]{1,2}[-\/][০-৯0-9]{1,2}[-\/][০-৯0-9]{2,4}\)?\s*$/,'');
  // শেষে খোলা বন্ধনী দিয়ে অসম্পূর্ণ তারিখ: (২৫-০৬-২০২৭
  n=n.replace(/\s*\([০-৯0-9]{1,2}[-\/][০-৯0-9]{1,2}[-\/][০-৯0-9]{2,4}$/,'');
  // এখনও কোনো বন্ধনী/তারিখের ছিটেফোঁটা থাকলে বাদ
  n=n.replace(/[\(\)]+\s*$/,'').trim();
  // ম্যানুয়াল মাল-মেলানো তালিকা প্রয়োগ (ইউজার সেট করা)
  const aliases=JSON.parse(localStorage.getItem('ngfItemAliases')||'{}');
  const key=n.toLowerCase();
  if(aliases[key]) n=aliases[key];
  return n.trim();
}

function topSellingThisMonth(){

}
// মাসভিত্তিক পরিসংখ্যান: কতজন কাস্টমার কিনেছে, কতজন নতুন, কতগুলো বিক্রয়
function monthlyStats(){
  const map={};
  // প্রথমে প্রতিটা কাস্টমারের প্রথম কেনার মাস বের করি (নতুন কাস্টমার গণনার জন্য)
  const firstMonth={};
  customers.forEach(c=>{
    c=migrateCustomer(c);
    let earliest=null;
    (c.sales||[]).forEach(s=>{ if(earliest===null || s.ts<earliest) earliest=s.ts; });
    if(earliest===null) earliest=c.firstTS||getTS(c);
    if(earliest){ const d=new Date(earliest); firstMonth[c.id]=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
  });
  customers.forEach(c=>{
    c=migrateCustomer(c);
    (c.sales||[]).forEach(s=>{
      const d=new Date(s.ts); const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
      if(!map[k]) map[k]={key:k,label:d.toLocaleDateString('bn-BD',{month:'long',year:'numeric'}),saleCount:0,custSet:new Set(),newCust:0,totalSale:0,totalProfit:0,totalKg:0};
      map[k].saleCount++;
      map[k].custSet.add(c.id);
      map[k].totalSale+=s.totalSale||0;
      map[k].totalProfit+=s.totalProfit||0;
      s.items.forEach(it=>{ if(!it.isOldDue) map[k].totalKg+=(it.kg||0); });
    });
  });
  // নতুন কাস্টমার গণনা
  Object.keys(firstMonth).forEach(cid=>{ const k=firstMonth[cid]; if(map[k]) map[k].newCust++; });
  return Object.keys(map).sort().reverse().map(k=>({...map[k], custCount:map[k].custSet.size}));
}
// প্রতিটা মাসের জন্য আলাদা সেরা-বিক্রিত মালের তালিকা (সারা বছর/সব মাস)
function monthlyTopSelling(){
  const monthMap={};
  customers.forEach(c=>{ c=migrateCustomer(c); (c.sales||[]).forEach(s=>{
    const d=new Date(s.ts); const mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    if(!monthMap[mk]) monthMap[mk]={key:mk,label:d.toLocaleDateString('bn-BD',{month:'long',year:'numeric'}),items:{}};
    s.items.forEach(it=>{
      if(it.isOldDue) return;
      const base=baseItemName(it.itemName);
      if(!monthMap[mk].items[base]) monthMap[mk].items[base]={name:base,kg:0,taka:0,bags:0};
      monthMap[mk].items[base].kg+=(it.kg||0); monthMap[mk].items[base].taka+=(it.saleAmount||0); monthMap[mk].items[base].bags+=(it.bags||0);
    });
  }); });
  return Object.keys(monthMap).sort().reverse().map(mk=>{
    const m=monthMap[mk];
    return {key:m.key, label:m.label, items:Object.values(m.items).sort((a,b)=>b.kg-a.kg)};
  });
}

// timestamp দিয়ে আজ চেক
function tsToday(ts){ if(!ts) return false; const d=new Date(ts),n=new Date(); return d.getDate()===n.getDate()&&d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
// এই মাসের চেক
function tsThisMonth(ts){ if(!ts) return false; const d=new Date(ts),n=new Date(); return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear(); }
// তারিখ গ্রুপের লেবেল (আজ/গতকাল/তারিখ)
function dateGroupLabel(ts){
  if(!ts) return 'তারিখ নেই';
  const d=new Date(ts),n=new Date();
  const today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const that=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff=Math.round((today-that)/86400000);
  if(diff===0) return 'আজ';
  if(diff===1) return 'গতকাল';
  return d.toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'});
}

/* ---------- CART (customer sale) ---------- */
function setCartBags(id,val){
  const v=parseFloat(val);
  const it=stock.find(s=>s.id==id);
  if(!v||v<=0){ delete cart[id]; }
  else { if(!cart[id]) cart[id]={bags:v,rate:it.salePrice,weight:it.bagWeight}; else cart[id].bags=v; }
  updateCartTotal();
}
function setCartRate(id,val){
  const r=parseFloat(val);
  const it=stock.find(s=>s.id==id);
  if(cart[id]){ cart[id].rate=(!r||r<=0)?it.salePrice:r; }
  updateCartTotal();
}
function setCartWeight(id,val){
  const w=parseFloat(val);
  const it=stock.find(s=>s.id==id);
  if(cart[id]){ cart[id].weight=(!w||w<=0)?it.bagWeight:w; }
  updateCartTotal();
}
function cartTotal(){ let t=0; Object.keys(cart).forEach(id=>{ const it=stock.find(s=>s.id==id); if(it) t+=cart[id].bags*cart[id].weight*cart[id].rate; }); return t; }
function cartTotalKg(){ let k=0; Object.keys(cart).forEach(id=>{ const it=stock.find(s=>s.id==id); if(it) k+=cart[id].bags*cart[id].weight; }); return k; }
function updateCartTotal(){
  const el=document.getElementById('cartTotal'); if(el) el.innerText='৳'+bn(cartTotal());
  const ek=document.getElementById('cartTotalKg'); if(ek) ek.innerText=bn(cartTotalKg())+' কেজি';
  // প্রতিটা মালের লাইনের হিসাব আপডেট (ফোকাস নষ্ট না করে)
  stock.forEach(it=>{
    const box=document.getElementById('lineinfo-'+it.id);
    if(!box) return;
    const cv=cart[it.id];
    if(cv){ box.innerHTML='<span class="blue bold">'+bn(cv.bags*cv.weight)+' কেজি</span><span class="green bold" style="font-size:13px">৳'+bn(cv.bags*cv.weight*cv.rate)+'</span>'; }
    else { box.innerHTML='<span class="xs gray" style="width:100%;text-align:center">ওজন ও দর খালি রাখলে স্টকের মান ধরা হবে</span>'; }
  });
}

/* ---------- CUSTOMER ---------- */
function saveCustomer(){
  const name=document.getElementById('cName').value.trim();
  const mobile=document.getElementById('cMobile').value.trim();
  const addr=document.getElementById('cAddr').value.trim();
  const paidNow=parseFloat(document.getElementById('cPaid').value)||0;
  const oldDue=parseFloat(document.getElementById('cOldDue').value)||0;
  const myFreight=parseFloat(document.getElementById('cMyFreight').value)||0;
  const custFreight=parseFloat(document.getElementById('cCustFreight').value)||0;
  const freightDue=parseFloat(document.getElementById('cFreightDue').value)||0;
  if(!selectedExisting && (!name||!mobile)){ alert('নাম ও মোবাইল দিন'); return; }
  if(Object.keys(cart).length===0 && oldDue<=0 && paidNow<=0){ alert('মাল সিলেক্ট করুন, অথবা বকেয়া/জমা লিখুন'); return; }
  // নতুন কাস্টমার হলে একই নম্বর আছে কিনা চেক করি
  if(!selectedExisting){
    function cleanMob(m){ return (m||'').replace(/[^0-9]/g,''); }
    const newMob=cleanMob(mobile);
    if(newMob.length>=6){
      const existing=customers.find(c=>cleanMob(c.mobile)===newMob);
      if(existing){
        const ex=migrateCustomer(existing);
        const t=custTotals(ex);
        const msg='⚠️ এই নম্বরে ইতিমধ্যে কাস্টমার আছে:\n\n'
          +'নাম: '+ex.name+'\n'
          +'বাকি: ৳'+bn(custNetDue(ex))+'\n\n'
          +'"OK" চাপলে এই বিক্রয় '+ex.name+'-এর সাথে যুক্ত হবে।\n'
          +'"Cancel" চাপলে আলাদা নতুন কাস্টমার হিসেবে যোগ হবে।';
        if(confirm(msg)){
          // পুরনো কাস্টমারে যুক্ত করি
          selectedExisting=existing.id;
        }
        // Cancel হলে selectedExisting=null থাকবে, নতুন কাস্টমার হবে
      }
    }
  }
  const _lbl = editingSale ? 'বিক্রয় এডিট' : (selectedExisting ? 'নতুন বিক্রয়' : 'নতুন কাস্টমার');
  snap(_lbl);
  snapCust((editingSale && editingSale.custId) || selectedExisting, _lbl);
  // এডিট মোড হলে আগে পুরনো বিক্রয়ের মাল স্টকে ফেরত দিই, তারপর নতুন হিসাব
  if(editingSale && editingSale.originalItems){ returnItemsToStock(editingSale.originalItems); }

  for(let id of Object.keys(cart)){
    const it=stock.find(s=>s.id==id);
    if(cart[id].bags>it.totalBags){
      alert(it.name+': শুধু '+it.totalBags+' বস্তা আছে');
      // ফেরত দেওয়া মাল আবার বাদ দিয়ে আগের অবস্থায় ফিরি
      if(editingSale && editingSale.originalItems){
        editingSale.originalItems.forEach(oi=>{
          if(oi.isOldDue) return;
          adjustStockBags(oi.stockId, oi.itemName, -(oi.bags||0));
        });
      }
      return;
    }
  }

  // বিক্রয়ের আইটেম ও হিসাব তৈরি + স্টক কমানো
  let saleTotal=0, saleCost=0; const items=[];
  stock=stock.map(it=>{
    const cv=cart[it.id];
    if(cv){ const b=cv.bags, rate=cv.rate, wt=cv.weight, kg=b*wt, sa=kg*rate, ca=kg*it.costPrice; saleTotal+=sa; saleCost+=ca;
      items.push({stockId:it.id,itemName:it.name,bags:b,kg,rate:rate,weight:wt,saleAmount:sa,profit:sa-ca});
      return {...it,totalBags:it.totalBags-b,totalKg:(it.totalBags-b)*it.bagWeight}; }
    return it;
  });

  // এডিটে স্টকে না পাওয়া মাল হুবহু ফিরিয়ে দিই (নাহলে বিল থেকে হারিয়ে যেত)
  if(editingSale && editingSale.keptItems && editingSale.keptItems.length){
    editingSale.keptItems.forEach(ki=>{
      items.push(JSON.parse(JSON.stringify(ki)));
      saleTotal+=(ki.saleAmount||0);
      saleCost+=((ki.saleAmount||0)-(ki.profit||0));
    });
  }

  // বাকিতে দেওয়া ভাড়া - বিলে যোগ হবে, লাভে প্রভাব নেই
  if(freightDue>0){
    items.push({itemName:'🚚 গাড়ি ভাড়া (আমি দিয়েছি, ফেরত পাব)',bags:0,kg:0,saleAmount:freightDue,profit:0,isOldDue:true});
    saleTotal+=freightDue;
  }

  const saleProfit=(saleTotal-saleCost-freightDue)-myFreight;

  // নতুন বিক্রয় অবজেক্ট (যদি মাল থাকে)
  let newSale=null;
  if(items.length>0){
    if(editingSale){
      newSale={ id:editingSale.saleId, ts:editingSale.ts, date:editingSale.date, items, totalSale:saleTotal, totalProfit:saleProfit, myFreight, custFreight };
    } else {
      newSale={ id:newId(), ts:Date.now(), date:now(), items, totalSale:saleTotal, totalProfit:saleProfit, myFreight, custFreight };
    }
  }

  const paymentEntry = paidNow>0 ? [{amount:paidNow,date:now(),ts:Date.now()}] : [];

  // পুরাতন কাস্টমার সিলেক্ট করা থাকলে তার নিচে যোগ করি
  if(selectedExisting){
    updateCustomerById(selectedExisting, c=>{
      let sales=(c.sales||[]).slice();
      if(editingSale){ sales=sales.filter(s=>String(s.id)!==String(editingSale.saleId)); }
      if(newSale) sales.push(newSale);
      return {...c, sales, oldDue:(c.oldDue||0)+oldDue, payments:(c.payments||[]).concat(paymentEntry), address:c.address||addr };
    });
  } else {
    // নতুন কাস্টমার তৈরি
    customers.push({
      id:newId(), name, mobile, address:addr,
      sales:newSale?[newSale]:[],
      oldDue:oldDue,
      payments:paymentEntry,
      firstTS:Date.now()
    });
  }

  cart={}; selectedExisting=null; editingSale=null; save(); showAddCustomer=false; render();
}

function saveReturn(){
  if(!returningSale) return;
  const {custId, saleId}=returningSale;
  let cust=customers.find(x=>x.id.toString()===custId.toString());
  cust=migrateCustomer(cust);
  const sale=(cust.sales||[]).find(s=>s.id.toString()===saleId.toString());
  if(!sale){ closeReturn(); return; }
  const keys=Object.keys(returnQty);
  if(keys.length===0){ alert('কত বস্তা ফেরত আসছে লিখুন'); return; }
  // যাচাই
  for(const k of keys){
    const it=sale.items[parseInt(k)];
    if(!it || returnQty[k]>it.bags){ alert((it?it.itemName:'')+': সর্বোচ্চ '+(it?it.bags:0)+' বস্তা ফেরত দেওয়া যাবে'); return; }
  }
  snap('মাল ফেরত');
  snapCust(custId,'মাল ফেরত');
  const retItems=[]; let retAmount=0;
  keys.forEach(k=>{
    const i=parseInt(k); const it=sale.items[i]; const qty=returnQty[k];
    const perBagKg=(it.weight)||((it.kg||0)/(it.bags||1));
    const kg=qty*perBagKg;
    const amt=kg*(it.rate||0);
    retAmount+=amt;
    retItems.push({stockId:it.stockId, itemName:it.itemName, bags:qty, kg, weight:perBagKg, rate:it.rate, amount:amt});
    // স্টকে ফেরত
    adjustStockBags(it.stockId, it.itemName, qty);
  });
  // কাস্টমারে রিটার্ন রেকর্ড
  updateCustomerById(custId, c=>({...c, returns:[...(c.returns||[]), {id:newId(), ts:Date.now(), date:now(), saleId, items:retItems, amount:retAmount}]}));
  closeReturn(); save(); render();
  alert('মাল ফেরত নেওয়া হয়েছে। ৳'+bn(retAmount)+' বিল থেকে বাদ গেল, স্টকেও ফেরত গেছে।');
}
function delReturn(custId, retId){
  if(!confirm('এই ফেরত বাতিল করবেন? মাল আবার স্টক থেকে বাদ যাবে।')) return;
  snap('ফেরত বাতিল');
  snapCust(custId,'ফেরত বাতিল');
  let cust=customers.find(x=>x.id.toString()===custId.toString());
  cust=migrateCustomer(cust);
  const r=(cust.returns||[]).find(x=>x.id.toString()===retId.toString());
  if(r){
    r.items.forEach(it=>{
      adjustStockBags(it.stockId, it.itemName, -(it.bags||0));
    });
  }
  updateCustomerById(custId, c=>({...c, returns:(c.returns||[]).filter(x=>String(x.id)!==String(retId))}));
  save(); render();
}

  const note=(noteInp.value||'').trim();

function addCustomerDue(id){

// কপি করা
function copyReceipt(id){
  const c=customers.find(x=>x.id===id);
  const txt=customerReceipt(c);
  if(navigator.clipboard){
    navigator.clipboard.writeText(txt).then(()=>alert('রসিদ কপি হয়েছে! এখন যেকোনো জায়গায় পেস্ট করুন।')).catch(()=>fallbackCopy(txt));
  } else { fallbackCopy(txt); }
}
function fallbackCopy(txt){
  // আধুনিক পদ্ধতি আগে
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>alert('রসিদ কপি হয়েছে! এখন WhatsApp/SMS এ পেস্ট করুন।')).catch(()=>legacyCopy(txt));
    return;
  }
  legacyCopy(txt);
}
function legacyCopy(txt){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ ta.setSelectionRange(0,999999); }catch(e){}
  let ok=false;
  try{ ok=document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  alert(ok?'রসিদ কপি হয়েছে! এখন WhatsApp/SMS এ পেস্ট করুন।':txt);
}
// সরাসরি কপি (শেয়ার নয়)
function copyOnlySaleReceipt(custId, saleId){

// একটা নির্দিষ্ট দিনের/বিক্রয়ের রসিদ কপি
function copySaleReceipt(custId, saleId){
  let c=customers.find(x=>x.id.toString()===custId.toString());
  c=migrateCustomer(c);
  const s=(c.sales||[]).find(x=>x.id.toString()===saleId.toString());
  if(!s) return;

  // এই বিক্রয়ের ঠিক আগে পর্যন্ত বাকি কত ছিল (টাইমলাইন থেকে)
  const tl=custTimeline(c);
  let beforeBal=0;
  for(const e of tl){
    if(e.type==='sale' && e.sale.id.toString()===saleId.toString()) break;
    if(e.type==='olddue') beforeBal+=e.amount;
    else if(e.type==='sale') beforeBal+=e.sale.totalSale||0;
    else if(e.type==='payment') beforeBal-=e.amount;
    else if(e.type==='discount') beforeBal-=e.amount;
  }

  // এই বিক্রয়ের পর থেকে পরের বিক্রয়ের আগ পর্যন্ত জমা/ছাড়
  const salesSorted=(c.sales||[]).slice().sort((a,b)=>a.ts-b.ts);
  const idx=salesSorted.findIndex(x=>x.id.toString()===saleId.toString());
  const nextSaleTS=(idx>=0 && idx<salesSorted.length-1) ? salesSorted[idx+1].ts : Infinity;
  const paysAfter=(c.payments||[]).filter(p=>(p.ts||0)>=s.ts && (p.ts||0)<nextSaleTS).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const discAfter=(c.discounts||[]).filter(d=>(d.ts||0)>=s.ts && (d.ts||0)<nextSaleTS).sort((a,b)=>(a.ts||0)-(b.ts||0));
  const paidAfter=paysAfter.reduce((a,p)=>a+p.amount,0);
  const discTotal=discAfter.reduce((a,d)=>a+d.amount,0);

  const saleKg=s.items.reduce((a,it)=>a+(it.kg||0),0);
  const afterSaleBal=beforeBal+(s.totalSale||0);
  const nowBal=custNetDue(c);

  const L='─────────────────';
  let t='🌾 NGF AGRO\n';
  t+='ফিড ও কাঁচামাল\n';
  t+=L+'\n';
  t+='কাস্টমার : '+c.name+'\n';
  if(c.mobile) t+='মোবাইল   : '+c.mobile+'\n';
  t+='তারিখ    : '+s.date+'\n';
  t+=L+'\n\n';

  t+='【 ১ 】আগের বকেয়া\n';
  t+='   ৳'+bn(beforeBal)+'\n\n';

  t+='【 ২ 】আজকের মাল\n';
  s.items.forEach((it,i)=>{
    if(it.isOldDue){ t+='  '+(i+1)+'. '+it.itemName+'\n      ৳'+bn(it.saleAmount)+'\n'; }
    else {
      t+='  '+(i+1)+'. '+it.itemName+'\n';
      t+='      '+it.bags+' বস্তা × '+bn(it.weight||0)+' কেজি = '+bn(it.kg)+' কেজি\n';
      t+='      দর ৳'+(it.rate||'')+'/কেজি → ৳'+bn(it.saleAmount)+'\n';
    }
  });
  if(s.custFreight>0) t+='  • ভাড়া (আপনি বহন করেছেন): ৳'+bn(s.custFreight)+'\n';
  t+='\n   মোট ওজন  : '+bn(saleKg)+' কেজি\n';
  t+='   মালের মোট : ৳'+bn(s.totalSale)+'\n\n';

  t+='【 ৩ 】মোট দাঁড়াল\n';
  t+='   ৳'+bn(beforeBal)+' + ৳'+bn(s.totalSale)+' = ৳'+bn(afterSaleBal)+'\n\n';

  if(paysAfter.length>0 || discAfter.length>0){
    t+='【 ৪ 】এরপর জমা\n';
    paysAfter.forEach(p=>{ t+='   '+p.date+'\n      জমা ৳'+bn(p.amount)+'\n'; });
    discAfter.forEach(d=>{ t+='   '+d.date+'\n      ছাড় ৳'+bn(d.amount)+(d.note?' ('+d.note+')':'')+'\n'; });
    t+='\n   মোট জমা/ছাড় : ৳'+bn(paidAfter+discTotal)+'\n\n';
  } else {
    t+='【 ৪ 】এরপর জমা\n   কোনো জমা হয়নি\n\n';
  }

  t+=L+'\n';
  t+='  বর্তমান বাকি : ৳'+bn(nowBal)+'\n';
  t+=L+'\n';
  t+='ধন্যবাদ — NGF AGRO';

  shareOrCopy(t);
}
// শেয়ার অথবা কপি - দুটোই নিশ্চিত করে
function shareOrCopy(t){
  if(navigator.share){ navigator.share({title:'NGF AGRO',text:t}).catch(()=>fallbackCopy(t)); }
  else fallbackCopy(t);
}

  editingSale={custId, saleId, myFreight:sale.myFreight||0, custFreight:sale.custFreight||0, freightDue:fdItem?fdItem.saleAmount:0, date:sale.date, ts:sale.ts, originalItems:JSON.parse(JSON.stringify(sale.items)), keptItems:kept, keptNames:keptNames};

  if(afterBal<-1) msg+='\n\n⚠️ সতর্কতা: এই বিক্রয় মুছলে কাস্টমারের জমা (৳'+bn(paid)+') বিলের চেয়ে ৳'+bn(Math.abs(afterBal))+' বেশি হয়ে যাবে। জমার হিসাবও ঠিক করতে হবে।';
  if(!confirm(msg)) return;
  snap('বিক্রয় মুছা');
  snapCust(custId,'বিক্রয় মুছা');
  let _done=false;
  customers=customers.map(c=>{
    c=migrateCustomer(c);
    if(!_done && String(c.id)===String(custId)){
      _done=true;
      const sale=(c.sales||[]).find(s=>String(s.id)===String(saleId));
      if(sale){ // স্টক ফেরত (আইডি মিলিয়ে, না পেলে নাম দিয়ে)
        sale.items.forEach(it=>{
          if(it.isOldDue) return;
          adjustStockBags(it.stockId, it.itemName, it.bags||0);
        });
      }
      return {...c, sales:(c.sales||[]).filter(s=>String(s.id)!==String(saleId))};
    }
    return c;
  });
  save(); render();
}

// সাপ্লায়ারের হিসাবের রসিদ তৈরি
function supplierReceipt(sp){
  const bal=sp.totalAmount-sp.totalPaid;
  const purchases=sp.purchases||[{desc:sp.desc,amount:sp.totalAmount,date:sp.date}];
  const L='─────────────────';
  let t='🌾 NGF AGRO\n';
  t+='সাপ্লায়ার হিসাব\n';
  t+=L+'\n';
  t+='সাপ্লায়ার : '+sp.name+'\n';
  if(sp.mobile) t+='মোবাইল   : '+sp.mobile+'\n';
  t+='তারিখ    : '+now()+'\n';
  t+=L+'\n\n';
  t+='【 ১ 】মালের হিসাব\n';
  purchases.forEach((pu,i)=>{
    t+='  '+(i+1)+'. '+(pu.date||'')+'\n';
    if(pu.desc) t+='      '+pu.desc+'\n';
    t+='      ৳'+bn(pu.amount)+'\n';
  });
  t+='\n   মোট দেনা : ৳'+bn(sp.totalAmount)+'\n\n';
  t+='【 ২ 】পরিশোধের হিসাব\n';
  if(sp.payments&&sp.payments.length){
    sp.payments.forEach(p=>{ t+='   '+p.date+'\n      ৳'+bn(p.amount)+'\n'; });
    t+='\n   মোট পরিশোধ : ৳'+bn(sp.totalPaid)+'\n\n';
  } else { t+='   কোনো পরিশোধ হয়নি\n\n'; }
  t+=L+'\n';
  t+='  বর্তমান বাকি : ৳'+bn(bal)+'\n';
  t+=L+'\n';
  t+='NGF AGRO';
  return t;
}
function shareSupplier(id){ const sp=suppliers.find(s=>s.id===id); if(sp) shareOrCopy(supplierReceipt(sp)); }

}

}

  h+='<div class="box box-green"><div class="bold green mb">📈 লাভের হিসাব</div><div class="grid2">';
  h+='<div class="stat" style="background:#dcfce7"><div class="num green">৳'+bn(todayProfit)+'</div><div class="lbl gray">আজকের লাভ</div></div>';
  h+='<div class="stat" style="background:#dcfce7"><div class="num green">৳'+bn(monthProfit)+'</div><div class="lbl gray">এই মাসের লাভ</div></div>';
  h+='</div>';
  h+='<div class="stat mt" style="background:#bbf7d0"><div class="num green">৳'+bn(totalProfit)+'</div><div class="lbl gray">সব মিলিয়ে মোট লাভ (শুরু থেকে)</div></div>';
  h+='<div class="xs gray center mt">এই মাসের বিক্রয়: ৳'+bn(monthSaleAmt)+'</div>';
  if(totalMyFreight>0) h+='<div class="xs red center mt">🚚 মোট ভাড়া খরচ (লাভ থেকে বাদ): ৳'+bn(totalMyFreight)+'</div>';
  const totalWd=withdrawals.reduce((s,w)=>s+w.amount,0);
  const totalDisc=customers.reduce((s,c)=>{ c=migrateCustomer(c); return s+(c.discounts||[]).reduce((a,d)=>a+d.amount,0); },0);
  const et=expenseTotals();
  // আজকের ও মাসের প্রকৃত লাভ (খরচ বাদে)
  h+='<div class="grid2 mt" style="gap:6px">';
  h+='<div class="stat" style="background:#fef2f2;padding:9px"><div class="num red" style="font-size:15px">৳'+bn(et.today)+'</div><div class="lbl gray">আজকের খরচ</div></div>';
  h+='<div class="stat" style="background:#fef2f2;padding:9px"><div class="num red" style="font-size:15px">৳'+bn(et.month)+'</div><div class="lbl gray">এই মাসের খরচ</div></div>';
  h+='</div>';
  h+='<div class="stat mt" style="background:#dcfce7"><div class="num green">৳'+bn(monthProfit-et.month)+'</div><div class="lbl gray">এই মাসের প্রকৃত লাভ (খরচ বাদে)</div></div>';
  if(totalDisc>0) h+='<div class="xs orange center mt">🏷️ মোট ছাড়/মওকুফ (লাভ থেকে বাদ): ৳'+bn(totalDisc)+'</div>';
  h+='<div class="between xs mt" style="border-top:1px dashed #cbe5d2;padding-top:6px"><span class="gray">💸 সব মিলিয়ে খরচ:</span><b class="red">৳'+bn(et.all)+'</b></div>';
  h+='<div class="between xs"><span class="gray">💼 মালিকের উত্তোলন:</span><b class="orange">৳'+bn(totalWd)+'</b></div>';
  h+='<div class="between sm bold" style="border-top:1px dashed #cbe5d2;padding-top:5px;margin-top:4px"><span>হাতে থাকা লাভ:</span><b class="green">৳'+bn(totalProfit-totalDisc-et.all-totalWd)+'</b></div>';
  h+='</div>';

  // ৩০+ দিন খোঁজ নেই এমন বকেয়াদার
  const inactive=customers.filter(c=>custNetDue(c)>0 && daysSince(custLastTS(c))>=custLimit(c));
  if(inactive.length>0){
    h+='<div class="box" style="background:#fdecea;border:1px solid #f5c6c0;border-left:4px solid var(--red)">';
    h+='<div class="bold red sm">⏰ '+inactive.length+' জন বকেয়াদারের অনেকদিন খোঁজ নেই!</div>';
    inactive.slice(0,5).forEach(c=>{
      h+='<div class="between xs mt"><span>'+c.name+' ('+daysSince(custLastTS(c))+' দিন)</span><span class="red bold">৳'+bn(custNetDue(c))+'</span></div>';
    });
    h+='<button class="btn btn-red btn-sm mt" style="width:100%" onclick="switchTab(\'due\')">বকেয়া তালিকায় যান</button>';
    h+='</div>';
  }

  // এই মাসের সারাংশ (কাস্টমার সংখ্যা, নতুন কাস্টমার, বিক্রয় সংখ্যা)
  const mstats=monthlyStats();
  const thisM=mstats.length>0 && (()=>{ const n=new Date(); const k=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0'); return mstats.find(m=>m.key===k); })();
  if(thisM){
    h+='<div class="box box-blue"><div class="bold blue mb">👥 এই মাসের সারাংশ</div><div class="grid2">';
    h+='<div class="stat" style="background:#fff"><div class="num blue">'+bn(thisM.custCount)+'</div><div class="lbl gray">জন কাস্টমার কিনেছে</div></div>';
    h+='<div class="stat" style="background:#fff"><div class="num green">'+bn(thisM.newCust)+'</div><div class="lbl gray">জন নতুন কাস্টমার</div></div>';
    h+='</div><div class="grid2 mt">';
    h+='<div class="stat" style="background:#fff"><div class="num orange">'+bn(thisM.saleCount)+'</div><div class="lbl gray">টি বিক্রয় হয়েছে</div></div>';
    h+='<div class="stat" style="background:#fff"><div class="num blue">'+bn(thisM.totalKg)+'</div><div class="lbl gray">কেজি মাল গেছে</div></div>';
    h+='</div></div>';
  }

  // সব মাসের পরিসংখ্যান (ক্লিক করলে খোলে)
  if(mstats.length>0){
    h+='<div class="box box-orange"><div class="between mb"><span class="bold orange">📊 মাসভিত্তিক পরিসংখ্যান</span><button class="btn btn-orange btn-sm" onclick="exportMonthlyStats()">📄 প্রিন্ট</button></div>';
    mstats.forEach(ms=>{
      const open=expandedStatMonth===ms.key;
      h+='<div onclick="toggleStatMonth(\''+ms.key+'\')" style="cursor:pointer;padding:6px 0;border-bottom:1px solid #eddbb3"><div class="between sm bold"><span>'+(open?'▼':'▶')+' '+ms.label+'</span><span class="xs gray">'+bn(ms.saleCount)+' বিক্রয় • '+bn(ms.custCount)+' জন</span></div></div>';
      if(open){
        h+='<div style="background:#fff;border-radius:8px;padding:9px;margin:5px 0 9px" class="xs">';
        h+='<div class="between" style="padding:3px 0"><span class="gray">মোট কাস্টমার কিনেছে</span><b class="blue">'+bn(ms.custCount)+' জন</b></div>';
        h+='<div class="between" style="padding:3px 0"><span class="gray">নতুন কাস্টমার</span><b class="green">'+bn(ms.newCust)+' জন</b></div>';
        h+='<div class="between" style="padding:3px 0"><span class="gray">মোট বিক্রয় সংখ্যা</span><b class="orange">'+bn(ms.saleCount)+' টি</b></div>';
        h+='<div class="between" style="padding:3px 0"><span class="gray">মোট মাল</span><b class="blue">'+bn(ms.totalKg)+' কেজি</b></div>';
        h+='<div class="between" style="padding:3px 0;border-top:1px dashed #eddbb3;margin-top:3px"><span class="gray">মোট বিক্রয়</span><b>৳'+bn(ms.totalSale)+'</b></div>';
        h+='<div class="between" style="padding:3px 0"><span class="gray">মোট লাভ</span><b class="green">৳'+bn(ms.totalProfit)+'</b></div>';
        h+='</div>';
      }
    });
    h+='</div>';
  }

  // মাসিক লাভের খাতা
  const months=monthlyProfits();
  if(months.length>0){
    h+='<div class="box box-green"><div class="bold green sm mb">📅 মাসিক লাভের খাতা <span class="xs gray">(তারিখে চাপুন)</span></div>';
    months.forEach(mo=>{
      const open=expandedMonth===mo.key;
      h+='<div onclick="toggleMonth(\''+mo.key+'\')" style="cursor:pointer;padding:4px 0;border-bottom:1px solid #cfe3d7"><div class="between xs"><span>'+(open?'▼ ':'▶ ')+mo.label+'</span><span><span class="gray">বিক্রয় ৳'+bn(mo.sale)+'</span> | <b class="green">লাভ ৳'+bn(mo.profit)+'</b></span></div></div>';
      if(open){
        h+='<div style="background:#fbfdfb;border-radius:6px;padding:6px;margin:4px 0 8px" class="xs">';
        const dayKeys=Object.keys(mo.days).sort().reverse();
        dayKeys.forEach(dk=>{
          const day=mo.days[dk];
          h+='<div class="between" style="padding:3px 0"><span class="gray">'+day.label+'</span><span><span class="gray">৳'+bn(day.sale)+'</span> | <b class="green">লাভ ৳'+bn(day.profit)+'</b></span></div>';
        });
        h+='</div>';
      }
    });
    h+='</div>';
  }

  // পাওনা-দেনা
  h+='<div class="grid2">';
  h+='<div class="stat" style="background:#fee2e2"><div class="num red">৳'+bn(totalDue)+'</div><div class="lbl gray">কাস্টমারের কাছে পাওনা</div></div>';
  h+='<div class="stat" style="background:#fef9c3"><div class="num orange">৳'+bn(myDebt)+'</div><div class="lbl gray">সাপ্লায়ারকে দেনা</div></div>';
  h+='</div>';
  h+='<div class="stat mt" style="background:#eff6ff"><div class="num blue">৳'+bn(stockValue)+'</div><div class="lbl gray">স্টকের মূল্য</div></div>';
  if(totalAdvance>0) h+='<div class="box box-blue xs mt"><div class="between"><span class="bold blue">💵 অগ্রিম জমা (বিলের বেশি নেওয়া):</span><b class="blue">৳'+bn(totalAdvance)+'</b></div><div class="xs gray mt">এই টাকা কাস্টমারদের পাওনা — পরের বিক্রয়ে সমন্বয় হবে</div></div>';

  // টপ বাকিদার
  const dueList=customers.filter(c=>custNetDue(c)>0).sort((a,b)=>custNetDue(b)-custNetDue(a)).slice(0,5);
  h+='<div class="divider"></div>';
  h+='<div class="bold sm mb">🔴 সবচেয়ে বেশি বাকি যাদের</div>';
  if(dueList.length===0){ h+='<p class="xs gray center" style="padding:8px">কোনো বাকি নেই 🎉</p>'; }
  else { dueList.forEach(c=>{ const bal=custNetDue(c); h+='<div class="between" style="padding:8px;background:#f9fafb;border-radius:6px;margin-bottom:5px"><div><div class="sm bold">'+c.name+'</div><div class="xs gray">📱'+c.mobile+'</div></div><div class="red bold">৳'+bn(bal)+'</div></div>'; }); }

  h+='<button class="btn btn-green mt" onclick="switchTab(\'customer\')">+ নতুন বিক্রয় / কাস্টমার</button>';
  return h;
}

function renderStock(){
  let h='';
  // মাসভিত্তিক সেরা বিক্রিত মাল - প্রতিটা মাস আলাদা, ক্লিক করলে খোলে
  const monthly=monthlyTopSelling();
  h+=`<div class="box box-green"><div class="between mb"><span class="bold green">🏆 মাসভিত্তিক সেরা বিক্রিত মাল</span><button class="btn btn-green btn-sm" onclick="exportMonthlyTopSelling()">📄 প্রিন্ট/টেক্সট</button></div>`;
  if(monthly.length===0) h+=`<p class="xs gray center" style="padding:8px">এখনো কোনো বিক্রয় নেই</p>`;
  else monthly.forEach(mo=>{
    const open=expandedTopMonth===mo.key;
    h+=`<div onclick="toggleTopMonth('${mo.key}')" style="cursor:pointer;padding:6px 0;border-bottom:1px solid #cfe3d7"><div class="between sm bold"><span>${open?'▼':'▶'} ${mo.label}</span><span class="gray xs">${mo.items.length} ধরনের মাল</span></div></div>`;
    if(open){
      h+=`<div style="padding:4px 0 8px">`;
      mo.items.forEach((r,i)=>{
        h+=`<div class="between xs" style="padding:4px 0;border-bottom:1px solid #f0ece0">
          <span><b>${i+1}.</b> ${r.name}</span>
          <span><b class="green">${bn(r.kg)} কেজি</b> <span class="gray">(${r.bags} বস্তা, ৳${bn(r.taka)})</span></span>
        </div>`;
      });
      h+=`</div>`;
    }
  });
  h+=`</div>`;
  h+=`<button class="btn btn-purple mb" onclick="toggleSalesReport()">${showSalesReport?'✕ রিপোর্ট বন্ধ করুন':'📊 সব সময়ের বিক্রয় রিপোর্ট দেখুন'}</button>`;
  if(showSalesReport){
    const report=itemSalesReport();
    h+=`<div class="box box-blue">`;
    h+=`<button class="btn btn-blue btn-sm mb" onclick="exportAllTimeSalesReport()">📄 প্রিন্ট/টেক্সট ডাউনলোড</button>`;
    if(report.length===0) h+=`<p class="center gray sm" style="padding:12px">এখনো কোনো বিক্রয় নেই</p>`;
    else report.forEach((r,i)=>{
      h+=`<div class="between" style="padding:6px 0;border-bottom:1px solid var(--line)">
        <div><span class="bold sm">${i+1}. ${r.name}</span><div class="xs gray">${r.bags} বস্তা • ${bn(r.kg)} কেজি</div></div>
        <div style="text-align:right"><div class="bold blue">৳${bn(r.taka)}</div><div class="xs green">লাভ ৳${bn(r.profit)}</div></div>
      </div>`;
    });
    h+=`</div>`;
  }
  h+=`<button class="btn btn-blue" onclick="toggleAddStock()">${showAddStock?'✕ বাতিল':'+ নতুন মাল যোগ করুন'}</button>`;
  if(showAddStock){
    h+=`<div class="box box-blue">
      <input id="sName" placeholder="মালের নাম (যেমন: ভুট্টা)">
      <div class="grid2">
        <input id="sBagWeight" type="number" placeholder="প্রতি বস্তা কত কেজি">
        <input id="sBags" type="number" placeholder="মোট কত বস্তা">
      </div>
      <div class="grid2">
        <input id="sCost" type="number" placeholder="কেনা দাম (কেজি)">
        <input id="sSale" type="number" placeholder="বিক্রয় দাম (কেজি)">
      </div>
      <button class="btn btn-blue" onclick="addStock()">যোগ করুন</button>
    </div>`;
  }
  if(stock.length===0) h+=`<p class="center gray sm" style="padding:24px">কোনো মাল নেই</p>`;
  else stock.forEach(it=>{
    h+=`<div class="item"><div class="item-head" onclick="toggleStock(${it.id})">
      <div><div class="bold sm">${it.name}</div><div class="xs gray">${it.totalBags} বস্তা | ${bn(it.totalKg)} কেজি | ৳${it.salePrice}/কেজি</div></div>
      <span>${expandedStock===it.id?'▲':'▼'}</span></div>`;
    if(expandedStock===it.id){
      h+=`<div class="item-body">
        <p>প্রতি বস্তা: ${it.bagWeight} কেজি</p>
        <p>কেনা: ৳${it.costPrice}/কেজি | বিক্রয়: ৳${it.salePrice}/কেজি</p>
        <p class="green bold">লাভ: ৳${it.salePrice-it.costPrice}/কেজি</p>
        <div class="flex mt">
          <button class="btn btn-red btn-sm" style="flex:1" onclick="adjustBags(${it.id},-1)">−১ বস্তা</button>
          <button class="btn btn-green btn-sm" style="flex:1" onclick="adjustBags(${it.id},1)">+১ বস্তা</button>
        </div>
        <div class="box box-blue xs mt">
          <div class="bold blue mb">✏️ স্টকের তথ্য ঠিক করুন</div>
          <div class="xs gray mb">ওজন কম/বেশি হলে বা দাম বদলালে এখানে ঠিক করুন</div>
          <div class="flex" style="gap:6px;margin-bottom:6px">
            <input type="number" id="ew-${it.id}" placeholder="বস্তার ওজন (${it.bagWeight})" value="${it.bagWeight}" style="flex:1;margin-bottom:0">
            <input type="number" id="ec-${it.id}" placeholder="কেনা ৳${it.costPrice}" value="${it.costPrice}" style="flex:1;margin-bottom:0">
          </div>
          <div class="flex" style="gap:6px">
            <input type="number" id="es-${it.id}" placeholder="বিক্রয় ৳${it.salePrice}" value="${it.salePrice}" style="flex:1;margin-bottom:0">
            <button class="btn btn-blue btn-sm" onclick="updateStockInfo(${it.id})">সেভ</button>
          </div>
        </div>
        <button class="btn btn-red btn-sm mt" style="width:100%" onclick="delStock(${it.id})">ডিলিট</button>
      </div>`;
    }
    h+=`</div>`;
  });
  return h;
}

    h+=`<div class="box box-green">`;

      h+=`<div class="box" style="background:#fdf6e3;border:1px solid #ecdba0;border-left:3.5px solid var(--wheat-deep)">
        <div class="between"><span class="bold orange">✏️ বিক্রয় এডিট করা হচ্ছে</span><span class="xs gray">${editingSale.date}</span></div>
        <p class="xs gray mt">মাল/ওজন/দাম/ভাড়া বদলে "সেভ করুন" চাপুন। তারিখ অপরিবর্তিত থাকবে।</p>

      </div>`;

      h+=`<input id="existSearchInput" placeholder="🔍 পুরাতন কাস্টমার খুঁজুন (নাম/মোবাইল)" value="${existSearch}" oninput="doExistSearch(this.value)">
        <div id="existResults">${renderExistResults()}</div>`;
    }
    if(selectedExisting){
      const sc=migrateCustomer(customers.find(c=>c.id.toString()===selectedExisting.toString()));
      const scBal=custNetDue(sc);
      h+=`<div style="background:var(--forest-soft);border:1.5px solid var(--forest);border-radius:11px;padding:10px">
        <div class="between"><span class="bold sm">✓ ${sc.name} ${creditBadge(sc)}</span>${editingSale?'<span class="xs gray">এডিট মোড</span>':'<span onclick="clearExisting()" class="xs" style="color:var(--clay);cursor:pointer;font-weight:600">✕ বদলান</span>'}</div>
        <div class="xs gray mt">📱 ${sc.mobile}${sc.address?' • 📍 '+sc.address:''}</div>
        <div class="between xs mt" style="padding-top:6px;border-top:1px dashed #cee3d7">
          <span class="gray">বর্তমান বাকি</span><b class="${scBal>0?'red':'green'}">${scBal>0?'৳'+bn(scBal):'✓ পরিশোধ'}</b>
        </div>
      </div>
      <input id="cName" type="hidden" value="x"><input id="cMobile" type="hidden" value="x"><input id="cAddr" type="hidden" value="">`;
    } else {
      h+=`<div class="xs gray mb" style="margin-top:6px">অথবা নতুন কাস্টমারের তথ্য লিখুন:</div>
      <input id="cName" placeholder="কাস্টমারের নাম">
      <input id="cMobile" type="tel" placeholder="মোবাইল নম্বর">
      <input id="cAddr" placeholder="ঠিকানা" style="margin-bottom:0">`;

    // ─── ধাপ ২: মাল ───
    h+=`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px">

        <span class="xs gray">(ঐচ্ছিক)</span>

    h+=`<div style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px">
      <div class="flex mb" style="gap:7px;align-items:center">
        <span style="background:var(--forest);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">৩</span>
        <span class="bold sm">ভাড়া ও আগের বকেয়া</span>
        <span class="xs gray">(থাকলে)</span>
      </div>
      <div class="xs gray mb" style="margin-bottom:4px">🚚 আমি ভাড়া দিয়েছি — লাভ থেকে বাদ যাবে</div>
      <input id="cMyFreight" type="number" value="${editingSale&&editingSale.myFreight?editingSale.myFreight:''}" placeholder="0" style="border-color:#e0b5ac">
      <div class="xs gray mb" style="margin-bottom:4px">🚚 কাস্টমার ভাড়া দিয়েছে — শুধু স্লিপে লেখা থাকবে</div>
      <input id="cCustFreight" type="number" value="${editingSale&&editingSale.custFreight?editingSale.custFreight:''}" placeholder="0" style="border-color:#b3d4c2">
      <div class="xs gray mb" style="margin-bottom:4px">🚚 আমি দিলাম, কাস্টমার পরে দেবে — বিলে যোগ হবে</div>
      <input id="cFreightDue" type="number" value="${editingSale&&editingSale.freightDue?editingSale.freightDue:''}" placeholder="0" style="border-color:#c8b3e0">
      <div class="xs gray mb" style="margin-bottom:4px">💰 আগের পুরাতন বকেয়া</div>
      <input id="cOldDue" type="number" placeholder="0" style="border-color:#e5c896;margin-bottom:0">
    </div>`;

    // ─── ধাপ ৪: হিসাব ও জমা ───
    h+=`<div style="background:linear-gradient(160deg,#fdf9ee,#fbf5e2);border:1.5px solid #ecdba0;border-radius:14px;padding:12px;margin-bottom:10px">
      <div class="flex mb" style="gap:7px;align-items:center">
        <span style="background:var(--wheat-deep);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700">৪</span>
        <span class="bold sm">হিসাব ও জমা</span>
      </div>
      <div class="between" style="padding:7px 0;border-bottom:1px dashed #e5d8b0">
        <span class="sm gray">মোট ওজন</span><b class="blue" id="cartTotalKg" style="font-size:15px">০ কেজি</b>
      </div>
      <div class="between" style="padding:9px 0">
        <span class="bold">নতুন মালের টাকা</span><b class="green" id="cartTotal" style="font-size:19px">৳০</b>
      </div>
      <div class="xs gray mb" style="margin-bottom:4px;margin-top:4px">এখন কত টাকা জমা দিল?</div>
      <input id="cPaid" type="number" placeholder="0 (না দিলে খালি রাখুন)" style="margin-bottom:0">
    </div>
    <button class="btn btn-green" style="padding:14px;font-size:15px" onclick="saveCustomer()">${editingSale?'✓ পরিবর্তন সেভ করুন':'✓ বিক্রয় সেভ করুন'}</button>
    </div>`;
  }
  // search
  if(customers.length>0){
    h+=`<input placeholder="🔍 নাম বা মোবাইল দিয়ে খুঁজুন" value="${custSearch}" oninput="doSearch(this.value)" style="margin-top:10px">`;
  }
  h+=`<div id="custList">${renderCustomerList()}</div>`;
  return h;
}

function renderOneCustomer(cu){
    cu=migrateCustomer(cu);
    const t=custTotals(cu);
    const bal=custNetDue(cu);
    const saleCount=(cu.sales||[]).length;
    let h='';
    const initial=(cu.name||'?').trim().charAt(0);
    const avCls=bal>0?'av-due':(bal<0?'av-adv':'av-paid');
    const amtCls=bal>0?'red':(bal<0?'blue':'green');
    const amtTxt=bal>0?'৳'+bn(bal):(bal<0?'৳'+bn(Math.abs(bal)):'✓');
    const amtCap=bal>0?'বাকি':(bal<0?'অগ্রিম জমা':'পরিশোধ');
    h+=`<div class="item"><div class="item-head" onclick="toggleCustomer(${cu.id})">
      <div class="avatar ${avCls}">${initial}</div>
      <div class="rowmain">
        <div class="rowname">${cu.name} ${creditBadge(cu)}</div>
        <div class="rowmeta">${cu.mobile}${cu.address?' · '+cu.address:''}</div>
        <div class="rowmeta">${saleCount} টি বিক্রয় · মোট ৳${bn(t.totalSale)}${cu.oldDue>0?' · আগের বকেয়া আছে':''}</div>
      </div>
      <div class="rowamt">
        <div class="big ${amtCls}">${amtTxt}</div>
        <div class="cap">${amtCap}</div>
      </div>
    </div>`;
    if(expandedCustomer===cu.id){
      h+=`<div class="item-body">`;
      // ─── এই কাস্টমারের নিজের ফেরানোর বক্স (সবার উপরে) ───
      h+=custUndoBox(cu);
      // ─── কাস্টমারের তথ্য এডিট ───
      if(editingCustInfo===cu.id.toString()){
        h+=`<div class="box box-blue" style="padding:11px;margin-top:0">
          <div class="bold blue mb">✏️ কাস্টমারের তথ্য বদলান</div>
          <div class="xs gray mb" style="margin-bottom:4px">নাম</div>
          <input id="cedit-name-${cu.id}" value="${(cu.name||'').replace(/"/g,'&quot;')}" placeholder="কাস্টমারের নাম">
          <div class="xs gray mb" style="margin-bottom:4px">মোবাইল</div>
          <input id="cedit-mob-${cu.id}" value="${(cu.mobile||'').replace(/"/g,'&quot;')}" placeholder="মোবাইল নম্বর">
          <div class="xs gray mb" style="margin-bottom:4px">ঠিকানা</div>
          <input id="cedit-addr-${cu.id}" value="${(cu.address||'').replace(/"/g,'&quot;')}" placeholder="ঠিকানা" style="margin-bottom:9px">
          <div class="flex" style="gap:6px">
            <button class="btn btn-green btn-sm" style="flex:1" onclick="saveCustomerInfo('${cu.id}')">✓ সেভ করুন</button>
            <button class="btn btn-red btn-sm" style="flex:1" onclick="toggleCustInfoEdit('${cu.id}')">✕ বাতিল</button>
          </div>
        </div>`;
      } else {
        h+=`<button class="btn btn-blue btn-sm mb" style="width:100%;margin-top:0" onclick="toggleCustInfoEdit('${cu.id}')">✏️ নাম / মোবাইল / ঠিকানা বদলান</button>`;
      }

      // প্রতিটা বিক্রয় আলাদা তারিখে
      if(saleCount===0 && cu.oldDue<=0){ h+=`<p class="xs gray">কোনো বিক্রয় নেই</p>`; }
      const salesSorted=(cu.sales||[]).slice().sort((a,b)=>b.ts-a.ts);
      salesSorted.forEach((s,si)=>{
        const saleKg=s.items.reduce((a,it)=>a+(it.kg||0),0);
        h+=`<div style="border:1px solid var(--line);border-radius:12px;padding:0;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-sm)">
          <div style="background:var(--forest-soft);padding:8px 10px;display:flex;justify-content:space-between;align-items:center">
            <span class="xs bold" style="color:var(--forest-deep)">📅 ${s.date}</span>
            <span class="xs gray">${dateGroupLabel(s.ts)}</span>
          </div>
          <div style="padding:9px 10px">`;
        s.items.forEach(it=>{
          h+=`<div style="padding:5px 0;border-bottom:1px dashed var(--line)">
            <div class="between xs"><span class="bold">${it.itemName}</span><span class="bold" style="color:var(--forest)">৳${bn(it.saleAmount)}</span></div>
            <div class="xs gray">${it.bags} বস্তা × ${bn(it.weight||0)} কেজি = ${bn(it.kg)} কেজি &nbsp;|&nbsp; দর ৳${it.rate||''}/কেজি</div>
          </div>`;
        });
        h+=`</div>
          <div style="background:#fbfaf4;padding:9px 10px;border-top:1px solid var(--line)">
            <div class="between xs"><span class="gray">⚖️ মোট ওজন</span><b class="blue">${bn(saleKg)} কেজি</b></div>
            <div class="between xs mt"><span class="gray">💰 চালানের মূল্য</span><b>৳${bn(s.totalSale)}</b></div>
            ${s.myFreight>0?`<div class="between xs mt"><span class="gray">🚚 আমার ভাড়া (বাদ)</span><span class="red">৳${bn(s.myFreight)}</span></div>`:''}
            ${s.custFreight>0?`<div class="between xs mt"><span class="gray">🚚 কাস্টমার ভাড়া</span><span class="gray">৳${bn(s.custFreight)}</span></div>`:''}
            <div class="between xs mt bold" style="border-top:1px dashed #d8cba0;padding-top:5px"><span>লাভ</span><b class="green">৳${bn(s.totalProfit)}</b></div>
          </div>
          <div class="flex" style="gap:6px;padding:8px 10px 4px;background:#fff">
            <button class="btn btn-green btn-sm" style="flex:1;padding:6px" onclick="copySaleReceipt('${cu.id}','${s.id}')">📲 শেয়ার</button>
            <button class="btn btn-orange btn-sm" style="flex:1;padding:6px" onclick="copyOnlySaleReceipt('${cu.id}','${s.id}')">📋 কপি</button>
          </div>
          <div class="flex" style="gap:6px;padding:0 10px 4px;background:#fff">
            <button class="btn btn-blue btn-sm" style="flex:1;padding:6px" onclick="editSale('${cu.id}','${s.id}')">✏️ এডিট</button>
            <button class="btn btn-red btn-sm" style="flex:1;padding:6px" onclick="delSale('${cu.id}','${s.id}')">🗑️ মুছুন</button>
          </div>
          <div style="padding:0 10px 8px;background:#fff">
            <button class="btn btn-purple btn-sm" style="width:100%;padding:6px" onclick="openReturn('${cu.id}','${s.id}')">↩️ মাল ফেরত নিন</button>
          </div>
          ${returningSale && returningSale.custId.toString()===cu.id.toString() && returningSale.saleId.toString()===s.id.toString() ? (()=>{
            let rh=`<div style="background:#f5edfb;border-top:2px solid var(--plum);padding:11px">
              <div class="bold mb" style="color:var(--plum)">↩️ কত বস্তা ফেরত আসছে?</div>`;
            s.items.forEach((it,i)=>{
              if(it.isOldDue) return;
              const perBag=(it.weight)||((it.kg||0)/(it.bags||1));
              rh+=`<div style="background:#fff;border-radius:8px;padding:8px;margin-bottom:6px">
                <div class="between xs"><span class="bold">${it.itemName}</span><span class="gray">নিয়েছে ${it.bags} বস্তা</span></div>
                <div class="flex mt" style="gap:6px;align-items:center">
                  <input type="number" placeholder="0" oninput="setReturnQty('${i}',this.value)" style="flex:1;margin-bottom:0;text-align:center">
                  <span class="xs gray">বস্তা × ${bn(perBag)} কেজি @৳${it.rate||0}</span>
                </div>
              </div>`;
            });
            rh+=`<div class="flex mt" style="gap:6px">
              <button class="btn btn-purple btn-sm" style="flex:1" onclick="saveReturn()">✓ ফেরত নিন</button>
              <button class="btn btn-red btn-sm" style="flex:1" onclick="closeReturn()">✕ বাতিল</button>
            </div></div>`;
            return rh;
          })() : ''}
        </div>`;
      });
      if(cu.oldDue>0){ h+=`<div style="background:#fdf2f8;border-radius:6px;padding:6px;margin-bottom:6px" class="xs"><div class="between"><span style="color:#be185d">💰 আগের/অতিরিক্ত বকেয়া:</span><b>৳${bn(cu.oldDue)}</b></div></div>`; }

      // ক্রেডিট রেটিং (সবুজ/হলুদ/লাল) সেট করা
      h+=`<div class="box" style="background:#f7f4ec;border:1px solid var(--line);padding:8px">
        <div class="bold xs mb">🎯 কাস্টমারের ধরন (বিক্রির সময় দেখা যাবে)</div>
        <div class="flex" style="gap:6px">
          <button class="btn btn-sm" style="flex:1;background:${cu.creditTag==='green'?'#1f5f3f':'#e6f0ea'};color:${cu.creditTag==='green'?'#fff':'#1f5f3f'}" onclick="setCreditTag('${cu.id}','green')">🟢 নিরাপদ</button>
          <button class="btn btn-sm" style="flex:1;background:${cu.creditTag==='yellow'?'#a5750f':'#fdf6e3'};color:${cu.creditTag==='yellow'?'#fff':'#a5750f'}" onclick="setCreditTag('${cu.id}','yellow')">🟡 মাঝারি</button>
          <button class="btn btn-sm" style="flex:1;background:${cu.creditTag==='red'?'#b5432f':'#fbe9e5'};color:${cu.creditTag==='red'?'#fff':'#b5432f'}" onclick="setCreditTag('${cu.id}','red')">🔴 ঝুঁকি</button>
        </div>
      </div>`;
      // এই কাস্টমারের নিজস্ব খোঁজ-সতর্কতা
      h+=`<div class="box box-blue xs" style="padding:8px">
        <div class="between"><span class="bold blue">⏰ খোঁজ-সতর্কতা (এই কাস্টমার)</span><span class="gray">${cu.inactiveDays?cu.inactiveDays+' দিন':'ডিফল্ট '+inactiveDaysLimit+' দিন'}</span></div>
        <div class="flex mt"><input id="inact-${cu.id}" type="number" placeholder="দিন (খালি=ডিফল্ট)" value="${cu.inactiveDays||''}" style="flex:1;margin-bottom:0"><button class="btn btn-blue btn-sm" onclick="setCustInactive('${cu.id}')">সেট</button></div>
      </div>`;
      // সময়ানুক্রমিক লেনদেন-খাতা (মাল+জমা+বকেয়া একসাথে, তারিখ ধরে)
      h+=`<div style="margin-bottom:8px">
        <button class="btn btn-blue btn-sm" style="width:100%" onclick="toggleTimeline('${cu.id}')">${expandedTimeline===cu.id.toString()?'✕ লেনদেন-খাতা বন্ধ করুন':'📜 সম্পূর্ণ লেনদেন-খাতা দেখুন (কোনটার পরে কোনটা)'}</button>
      </div>`;
      if(expandedTimeline===cu.id.toString()){
        const timeline=custTimeline(cu);
        h+=`<div style="background:#fbfaf4;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px">`;
        if(timeline.length===0) h+=`<p class="xs gray center">কোনো লেনদেন নেই</p>`;
        timeline.forEach(e=>{
          if(e.type==='olddue'){
            h+=`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div class="between xs"><span class="orange bold">🏁 আগের/শুরুর বকেয়া</span><span class="orange bold">৳${bn(e.amount)}</span></div><div class="xs gray mt">চলমান বাকি: ৳${bn(e.runningBal)}</div></div>`;
          } else if(e.type==='sale'){
            const kg=e.sale.items.reduce((a,it)=>a+(it.kg||0),0);
            h+=`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div class="between xs"><span class="blue bold">📦 মাল নিলো — ${e.sale.date}</span><span class="blue bold">৳${bn(e.sale.totalSale)}</span></div><div class="xs gray">${e.sale.items.map(it=>it.itemName).join(', ')} (${bn(kg)} কেজি)</div><div class="xs gray mt">চলমান বাকি: ৳${bn(e.runningBal)}</div></div>`;
          } else if(e.type==='payment'){
            h+=`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div class="between xs"><span class="green bold">💰 জমা দিলো — ${e.date}</span><span class="green bold">৳${bn(e.amount)}</span></div><div class="xs gray mt">চলমান বাকি: ৳${bn(e.runningBal)}</div></div>`;
          } else if(e.type==='return'){
            h+=`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div class="between xs"><span class="bold" style="color:var(--plum)">↩️ মাল ফেরত — ${e.date}</span><span class="bold" style="color:var(--plum)">−৳${bn(e.amount)}</span></div><div class="xs gray">${(e.items||[]).map(it=>it.itemName+' '+it.bags+' বস্তা').join(', ')}</div><div class="xs gray mt">চলমান বাকি: ৳${bn(e.runningBal)}</div></div>`;
          } else if(e.type==='discount'){
            h+=`<div style="padding:6px 0;border-bottom:1px dashed var(--line)"><div class="between xs"><span class="orange bold">🏷️ ছাড় দিলাম — ${e.date}</span><span class="orange bold">৳${bn(e.amount)}</span></div>${e.note?`<div class="xs gray">${e.note}</div>`:''}<div class="xs gray mt">চলমান বাকি: ৳${bn(e.runningBal)}</div></div>`;
          }
        });
        h+=`</div>`;
      }
      // ফেরতের হিসাব (যদি থাকে)
      if(cu.returns&&cu.returns.length){
        h+=`<div class="bold xs mt mb">↩️ ফেরত আসা মাল:</div><div style="background:#f5edfb;border-radius:8px;padding:9px" class="xs">`;
        cu.returns.slice().reverse().forEach(r=>{
          h+=`<div style="padding:4px 0;border-bottom:1px solid #e6d5f2">
            <div class="between"><span class="gray">${r.date}</span><span><b style="color:var(--plum)">−৳${bn(r.amount)}</b> <span onclick="delReturn('${cu.id}','${r.id}')" style="color:#b3402c;cursor:pointer;margin-left:6px">✕</span></span></div>
            ${r.items.map(it=>`<div class="xs gray">${it.itemName} — ${it.bags} বস্তা (${bn(it.kg)} কেজি)</div>`).join('')}
          </div>`;
        });
        h+=`</div>`;
      }
      // ছাড়ের হিসাব (যদি থাকে)
      if(cu.discounts&&cu.discounts.length){ h+=`<div class="bold xs mt mb">🏷️ ছাড়/মওকুফের হিসাব:</div><div style="background:#fdf6e3;border-radius:6px;padding:8px" class="xs">`; cu.discounts.slice().reverse().forEach(d=>{ h+=`<div class="between"><span class="gray">${d.date}${d.note?' • '+d.note:''}</span><span class="orange bold">৳${bn(d.amount)}</span></div>`; }); h+=`</div>`; }
      // মাসিক মালের হিসাব
      const cmk=custMonthlyKg(cu);
      if(cmk.length>0){
        h+=`<div class="box box-blue xs"><div class="bold blue mb">📊 মাসিক মালের হিসাব</div>`;
        cmk.forEach(mo=>{
          h+=`<div class="between" style="padding:3px 0;border-bottom:1px solid #dbe7f7"><span>${mo.label}</span><span><b class="blue">${bn(mo.kg)} কেজি</b> <span class="gray">| ৳${bn(mo.taka)}</span></span></div>`;
        });
        h+=`</div>`;
      }
      // জমার হিসাব

function renderCustomerList(){
  let list=customers.slice();
  if(custSearch.trim()){ const q=custSearch.toLowerCase(); list=list.filter(c=>c.name.toLowerCase().includes(q)||(c.mobile||'').includes(q)); }
  if(list.length===0) return `<p class="center gray sm" style="padding:24px">কোনো কাস্টমার নেই</p>`;
  // শেষ লেনদেনের তারিখ অনুযায়ী নতুন-আগে সাজাই, তারপর দিন ধরে গ্রুপ করি
  list.sort((a,b)=>custLastTS(b)-custLastTS(a));
  const groups={}; const order=[];
  list.forEach(cu=>{ const k=dateGroupKey(custLastTS(cu)); if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(cu); });
  let h='';
  order.forEach(k=>{
    const arr=groups[k];
    const label=dateGroupLabel(custLastTS(arr[0]));
    const dayDue=arr.reduce((a,c)=>a+custDueOnly(c),0);
    h+=`<div class="daybar"><span class="d">${label}</span><span class="n">${bn(arr.length)} জন${dayDue>0?' · বাকি ৳'+bn(dayDue):''}</span></div>`;
    arr.forEach(cu=>{ h+=renderOneCustomer(cu); });
  });
  return h;
}

    <div class="xs gray mb" style="margin-bottom:4px">অথবা নতুন খাত লিখুন (ঐচ্ছিক)</div>
    <input id="expNewCat" placeholder="যেমন: মেরামত খরচ">
    <div class="xs gray mb" style="margin-bottom:4px">বিবরণ (ঐচ্ছিক)</div>
    <input id="expNote" placeholder="যেমন: দোকানের তালা মেরামত">
    <div class="flex"><input id="expAmount" type="number" placeholder="টাকার পরিমাণ" style="flex:1;margin-bottom:0"><button class="btn btn-orange btn-sm" onclick="addExpense()">যোগ করুন</button></div>
  </div>`;

  // এই মাসের খাত অনুযায়ী ভাগ
  if(catList.length>0){
    h+=`<div class="box box-blue"><div class="bold blue mb">📊 এই মাসের খাত অনুযায়ী খরচ</div>`;
    catList.forEach(c=>{
      const pct=et.month>0?Math.round(c.amt/et.month*100):0;
      h+=`<div style="padding:5px 0;border-bottom:1px solid #d1ddf1">
        <div class="between xs"><span class="bold">${c.cat}</span><span><b>৳${bn(c.amt)}</b> <span class="gray">(${bn(pct)}%)</span></span></div>
        <div style="height:5px;background:#dde5f3;border-radius:3px;margin-top:3px;overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--indigo);border-radius:3px"></div></div>
      </div>`;
    });
    h+=`</div>`;
  }

  // মাসভিত্তিক খরচ
  const mExp=monthlyExpenses();
  if(mExp.length>0){
    h+=`<div class="box box-green"><div class="between mb"><span class="bold green">📅 মাসভিত্তিক খরচ</span><button class="btn btn-green btn-sm" onclick="exportExpenses()">📄 প্রিন্ট</button></div>`;
    mExp.forEach(m=>{
      const open=expandedExpMonth===m.key;
      h+=`<div onclick="toggleExpMonth('${m.key}')" style="cursor:pointer;padding:6px 0;border-bottom:1px solid #cee3d7"><div class="between sm bold"><span>${open?'▼':'▶'} ${m.label}</span><b class="red">৳${bn(m.total)}</b></div></div>`;
      if(open){
        h+=`<div style="background:#fff;border-radius:8px;padding:9px;margin:5px 0 9px" class="xs">`;
        Object.entries(m.cats).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
          h+=`<div class="between" style="padding:3px 0"><span class="gray">${cat}</span><b>৳${bn(amt)}</b></div>`;
        });

      }

  }

    // তারিখ অনুযায়ী গ্রুপ
    const groups={}; const order=[];
    sorted.forEach(e=>{ const k=dateGroupKey(e.ts); if(!groups[k]){ groups[k]=[]; order.push(k); } groups[k].push(e); });

      const arr=groups[k];

  }

  h+=`</div></div>`;

  return h;
}
function toggleExpMonth(k){ expandedExpMonth = expandedExpMonth===k ? null : k; render(); }
// খরচের রিপোর্ট টেক্সট
function exportExpenses(){
  const mExp=monthlyExpenses();
  const et=expenseTotals();
  let t='🌾 NGF AGRO\n';
  t+='খরচের রিপোর্ট\n';
  t+='তারিখ: '+now()+'\n';
  t+='===============================\n\n';
  t+='আজকের খরচ    : ৳'+bn(et.today)+'\n';
  t+='এই মাসের খরচ  : ৳'+bn(et.month)+'\n';
  t+='সব মিলিয়ে মোট : ৳'+bn(et.all)+'\n';
  mExp.forEach(m=>{
    t+='\n■ '+m.label+' — মোট ৳'+bn(m.total)+'\n';
    t+='-------------------------------\n';
    Object.entries(m.cats).sort((a,b)=>b[1]-a[1]).forEach(([cat,amt])=>{
      t+='  '+cat+': ৳'+bn(amt)+'\n';
    });
  });
  t+='\n===============================\n   NGF AGRO\n';
  dl(t,'NGF_AGRO_খরচের_রিপোর্ট_'+new Date().toISOString().slice(0,10)+'.txt','text/plain');
}

    <input id="aliasFrom" placeholder="এই নামটা (যেমন: মিকচার ভুষি)" style="margin-bottom:6px">

// পুরনো কাস্টমার নতুন কাঠামোয় + একই মোবাইলের ডুপ্লিকেট এক করা
(function migrateAll(){
  if(customers.length){
    // শুধু কাঠামো নতুন করি (পুরনো→নতুন), অটো-মার্জ করি না (আলাদা লোক মেশার ঝুঁকি এড়াতে)
    customers=customers.map(c=>migrateCustomer(c));
  }
  // জমা/ছাড়ের সময়ের ছাপ না থাকলে তারিখ থেকে উদ্ধার করি (নাহলে হিসাবের ক্রম ভুল হয়)
  backfillTimestamps();
  // ডুপ্লিকেট আইডি ঠিক করি - একই আইডি থাকলে ডাটা গুলিয়ে যায়
  (function fixDuplicateIds(){
    let fixed=0;
    const seen={};
    customers.forEach(c=>{
      let id=c.id;
      if(id===undefined||id===null||seen[id]){ id=newId(); c.id=id; fixed++; }
      seen[id]=true;
      // প্রতিটা কাস্টমারের ভেতরের বিক্রয়ের আইডিও অনন্য করি
      const seenSale={};
      (c.sales||[]).forEach(s=>{
        let sid=s.id;
        if(sid===undefined||sid===null||seenSale[sid]){ sid=newId(); s.id=sid; fixed++; }
        seenSale[sid]=true;
      });
    });
    const seenSup={};
    suppliers.forEach(s=>{ let id=s.id; if(id===undefined||id===null||seenSup[id]){ id=newId(); s.id=id; fixed++; } seenSup[id]=true; });
    const seenSt={};
    stock.forEach(s=>{ let id=s.id; if(id===undefined||id===null||seenSt[id]){ id=newId(); s.id=id; fixed++; } seenSt[id]=true; });
    const seenW={};
    withdrawals.forEach(w=>{ let id=w.id; if(id===undefined||id===null||seenW[id]){ id=newId(); w.id=id; fixed++; } seenW[id]=true; });
    const seenE={};
    expenses.forEach(e=>{ let id=e.id; if(id===undefined||id===null||seenE[id]){ id=newId(); e.id=id; fixed++; } seenE[id]=true; });
    // _lastId সর্বোচ্চ আইডির সাথে মেলাই যাতে নতুন আইডি কখনো পুরনোর সাথে মিলে না যায়
    const allIds=[].concat(customers.map(c=>c.id), suppliers.map(s=>s.id), stock.map(s=>s.id), withdrawals.map(w=>w.id), expenses.map(e=>e.id));
    customers.forEach(c=>(c.sales||[]).forEach(s=>allIds.push(s.id)));
    const maxId=allIds.reduce((a,b)=>(typeof b==='number'&&b>a)?b:a, 0);
    if(maxId>_lastId) _lastId=maxId;
    if(fixed>0){ console.log('ডুপ্লিকেট আইডি ঠিক করা হলো:', fixed); }
  })();
  save();
})();
